
name: AC Nav Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Bundle TensorFlow libraries locally
        run: |
          set -e
          mkdir -p www/vendor

          cp node_modules/@tensorflow/tfjs/dist/tf.min.js www/vendor/tf.min.js

          cp node_modules/@tensorflow-models/coco-ssd/dist/coco-ssd.min.js www/vendor/coco-ssd.min.js

          mkdir -p www/vendor/leaflet
          cp -r node_modules/leaflet/dist/. www/vendor/leaflet/
          test -s www/vendor/leaflet/leaflet.js

          test -s www/vendor/tf.min.js
          test -s www/vendor/coco-ssd.min.js

      - name: Download COCO-SSD models (offline)
        shell: bash
        run: |
          node scripts/get-coco.js

      - name: Download YOLO12n model
        shell: bash
        run: |
          set -euo pipefail

          git lfs install

          git clone --depth 1 https://github.com/AlessandroFerrante/StreetSignSense.git /tmp/StreetSignSense

          git -C /tmp/StreetSignSense lfs pull

          MODEL_DIR=/tmp/StreetSignSense/demo/assets/models/StreetSignSenseY12n_tfjs_converted

          test -s "$MODEL_DIR/model.json"

          mkdir -p www/models/signs

          cp -a "$MODEL_DIR"/. www/models/signs/

          test -s www/models/signs/model.json

          echo "YOLO model successfully copied"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application#' android/app/src/main/AndroidManifest.xml

          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries><application#' android/app/src/main/AndroidManifest.xml

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AC-Nav-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
