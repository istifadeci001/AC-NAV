name: APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Download sign model into the app
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/AlessandroFerrante/StreetSignSense.git sss
          (cd sss && git lfs pull || true)
          M=$(find sss -type d -name 'yolov12n_web_model' | head -1)
          echo "model dir: $M"; ls -la "$M"
          mkdir -p www/models/signs && cp -r "$M"/. www/models/signs/
          du -sh www/models/signs; find www/models/signs -size -1k
      - run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-feature android:name="android.hardware.camera" android:required="false"/><application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AC-Nav-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
